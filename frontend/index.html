<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>ElectroGuard AI — Report Any Fault. Dispatch Instantly. Predict Outages.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body>

<!-- Side Slidebar Drawer (All Page Navigation) -->
<div class="sidebar-overlay" id="sidebar-overlay"></div>
<aside class="sidebar-drawer" id="sidebar-drawer">
  <div class="sidebar-header">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#1a1204" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z"/></svg>
      </div>
      <div class="brand-text">
        <h1 style="font-size:18px">ElectroGuard AI</h1>
        <p style="font-size:11px">Grid Safety Platform</p>
      </div>
    </div>
    <button class="sidebar-close-btn" id="sidebar-close-btn" title="Close Menu">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>

  <nav class="sidebar-nav" id="sidebar-nav"></nav>

  <div class="sidebar-footer">
    <span>ElectroGuard AI v2.5</span><br>
    <span style="opacity:0.6">Powered by Google Gemini</span>
  </div>
</aside>

<!-- Main Container -->
<div id="app">

  <header class="topbar">
    <div style="display:flex;align-items:center;gap:12px">
      <button class="hamburger-btn" id="hamburger-btn" title="Open Navigation Sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="brand">
        <div class="brand-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="#1a1204" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z"/></svg>
        </div>
        <div class="brand-text">
          <h1>ElectroGuard AI</h1>
          <p>Report Any Fault. Dispatch Instantly. Predict Outages. Zero Delay.</p>
        </div>
      </div>
    </div>

    <div style="display:flex;gap:10px;align-items:center">
      <button class="status-chip" id="user-session-chip">
        <span>Login / Sign Up</span>
      </button>
      <button class="status-chip" id="backend-chip" style="border:1px solid var(--border);background:var(--bg-elevated)">
        <span class="status-dot" id="backend-dot"></span> 
        <span id="backend-label">GRID LINK ACTIVE</span>
      </button>
    </div>
  </header>

  <main id="content" style="margin-top:20px"></main>
</div>

<!-- Login & Signup Modal Popup -->
<div class="modal-overlay" id="auth-modal-overlay">
  <div class="modal-card">
    <button class="modal-close-btn" id="modal-close-btn">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
    <div id="modal-content"></div>
  </div>
</div>

<div id="toast-container"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
